# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot

version: 2

updates:
    # Enable version updates for npm
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      commit-message:
          prefix: "deps"
      # Supply-chain gate: only propose releases at least 7 days old.
      # Also prevents rebases from retargeting to fresh releases.
      cooldown:
          default-days: 7
      # The rocketh monorepo family releases in lockstep; one grouped PR
      # instead of five lockfile-conflicting ones.
      groups:
          rocketh:
              patterns:
                  - "rocketh"
                  - "@rocketh/*"
          # The toolbox pins the mocha major through hardhat-mocha's peer
          # range; bumping either one alone fails npm ci (ERESOLVE).
          mocha:
              patterns:
                  - "mocha"
                  - "@nomicfoundation/hardhat-toolbox-mocha-ethers"

    # Enable version updates for GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "ci"
      cooldown:
          default-days: 7
