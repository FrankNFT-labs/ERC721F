name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    hardhat:
        name: Hardhat Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"

            - name: Install dependencies
              run: npm ci

            - name: Rewrite example imports for local dev
              run: npm run update-example-imports:dev

            - name: Compile contracts
              run: npx hardhat compile

            - name: Run tests
              run: npm test

    foundry:
        name: Foundry Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install Node dependencies (required for remappings)
              run: npm ci

            - name: Rewrite example imports for local dev
              run: npm run update-example-imports:dev

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  # Pinned: `stable` upgrades under us (1.8.0 broke main with
                  # zero repo changes). Bump deliberately, after a local run.
                  version: v1.8.0

            - name: Build contracts
              run: forge build

            - name: Run tests
              run: forge test
